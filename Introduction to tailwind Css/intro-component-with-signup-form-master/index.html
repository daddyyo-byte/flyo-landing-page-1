<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Intro component with sign up form</title>
  </head>
  <body
    class="min-h-screen bg-[hsl(0,100%,74%)] flex justify-center items-center p-4"
  >
    <main
      class="mx-auto w-full max-w-sm px-6 py-4 flex flex-col gap-6 justify-center items-center
      lg:flex-row lg:max-w-full lg:mx-0 justify-evenly lg:p-0"
    >
      <section class=" text-white flex flex-col justify-center gap-3 items-center 
      lg:gap-8">
        <h1 class=" font-bold w-[300px] text-3xl  text-center
        lg:text-start lg:text-4xl lg:w-[400px]">Learn to code by watching others</h1>
        <p class="text-center w-[310px] text-lg
        lg:text-start lg:w-[400px] lg:text-sm">
          See how experienced developers solve problems in real-time. Watching
          scripted tutorials is great, but understanding how developers think is
          invaluable.
        </p>
      </section>

      <section class="w-full flex flex-col justify-center items-center  gap-6
      lg:w-2/5">
        <button class="bg-[hsl(248,32%,49%)] w-full lg:w-4/5 rounded-lg p-6 text-white text-2xl
        lg:text-lg lg:p-2">Try it free 7 days <span class="text-[hsl(246,25%,77%)]">then $20/mo. thereafter</span></button>

        <form class="bg-white shadow-lg rounded-lg w-full lg:w-4/5 px-6 py-4 flex flex-col gap-6">
          <input
            type="text"
            id="firstname"
            placeholder="First Name"
            required
            class="w-full border-1 border-solid border-[hsl(249,10%,26%)] rounded-lg px-6 py-4 font-semibold caret-purple-700 focus:border-purple
            lg:py-2"
          />

          <input
            type="text"
            id="lastname"
            placeholder="Last Name"
            required
            class="w-full border-1 border-solid border-[hsl(249,10%,26%)] rounded-lg px-6 py-4 font-semibold
            lg:py-2"
          />

          <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
            class="w-full border-1 border-solid border-[hsl(249,10%,26%)] rounded-lg px-6 py-4 font-semibold
            lg:py-2"
          />

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
            class="w-full border-1 border-solid border-[hsl(249,10%,26%)] rounded-lg px-6 py-4 font-semibold
            lg:py-2"
          />

          <button class="w-full bg-[hsl(154,59%,51%)] px-6 py-4 rounded-lg shadow-lg text-[#DEFFF8]  text-lg
          lg:py-2">Claim your free trial</button>
          <p class="text-[hsl(246,25%,77%)] text-center w-[280px] text-[14px]
          lg:w-full lg:text-[11px]">
            By clicking the button, you are agreeing to our <span class="text-[hsl(0,100%,74%)] font-semibold">Terms and Services</span>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
