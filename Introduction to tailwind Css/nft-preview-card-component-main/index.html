<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | NFT preview card component</title>
</head>
  <body
    class="bg-[#0D1A2D] min-h-screen font-[Outfit] flex justify-center items-center p-2"
  >
    <main class=" bg-[#15273F] w-full  max-w-[400px] px-6 py-4 rounded-lg">
      <div class="flex justify-center items-center mb-4">
        <img
          src="/images/image-equilibrium.jpg"
          alt="equilibrum"
          class="rounded-lg w-[340px]"
        />
      </div>

      <h1 class="text-white text-2xl mb-3">Equilibrium #3429</h1>
      <p class="text-[#6B80A0] text-xl mb-4">
        Our Equilibrium collection promotes balance and calm.
      </p>

      <div class="flex justify-between items-center mb-3">
        <div class="flex justify-center gap-2 items-center">
          <img src="/images/icon-ethereum.svg" alt="etheruem" />
          <p class="text-[#1FB8C1] bold">0.041 ETH</p>
        </div>

        <div class="flex justify-center gap-2 items-center">
          <img src="/images/icon-clock.svg" alt="clock" />
          <p class="text-[#8BAFDB] text-sm">3 days left</p>
        </div>
      </div>

      <div class="w-full border-[#25374F] mb-3 border-1 border-solid"></div>

      <div class="flex justify-start gap-2 items-center">
        <img src="/images/image-avatar.png" alt="avatar" class="w-[30px]  border-1 border-solid border-[#DDE7F3] rounded-2xl" />
        <p class="text-[#8BAFDB] text-sm">
          Creation of <span class="text-[#DDE7F3]">Jules Wyvern</span>
        </p>
      </div>
    </main>
  </body>
</html>
