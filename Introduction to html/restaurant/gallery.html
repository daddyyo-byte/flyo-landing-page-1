<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Savoury Restaurant</title>
  </head>
  <body>
    <section class="header">
      <h1>Savory</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="#food">Food Gallery</a></li>
        </ul>
      </nav>
      <button><a href="reservation.html">Reservation</a></button>
    </section>

    <section class="gallery-container">
      <div class="gallery-text">
        <h2>Food Gallery</h2>
      </div>
      <div class="hr"></div>

      <div class="image-container">
        <div class="image-wrapper">
          <img
            src="./images/Creamy Tagliatelle with Black Truffle.png"
            alt="Truffle pasta"
          />
          <p>Truffle Pasta</p>
        </div>
        <div class="image-wrapper">
          <img
            src="./images/Herb-Grilled Chicken with Greens and Lemon.png"
            alt="grilled chicken"
          />
          <p>Grilled chicken</p>
        </div>
        <div class="image-wrapper">
          <img
            src="./images/Colorful Roasted Sweet Potato Grain Bowl.png"
            alt="Sweet potato"
          />
          <p>Sweet Potato</p>
        </div>
      </div>

      <div class="image-container">
        <div class="image-wrapper">
          <img
            src="./images/Gourmet Brioche Cheeseburger on Ceramic Plate.png"
            alt="Classic burger"
          />
          <p>Classic Burger</p>
        </div>
        <div class="image-wrapper">
          <img
            src="./images/Chocolate Layer Cake with Raspberries.png"
            alt="chocolate cake"
          />
          <p>Chocolate Cake</p>
        </div>
        <div class="image-wrapper">
          <img
            src="./images/Elegant Ruby Grapefruit Mocktail.png"
            alt="Mocktail"
          />
          <p>Mocktail</p>
        </div>
      </div>
    </section>

    <section class="reservation">
      <h3>Ready to dine with us?</h3>
      <div class="button-wrapper">
        <button>Reserve a Table</button>
      </div>
    </section>

    <footer>
      <div class="side1">
        <img
          src="./images/iconmonstr-location-pin-thin.svg"
          alt="location icon"
        />
        <p>123 DaddyYo street knackademus estate, Nigeria</p>
      </div>

      <div class="mr"></div>

      <div class="side2">
        <div class="sub-side">
          <img src="./images/phone-519.svg" alt="phone icon" />
          <p>09054893809</p>
        </div>

        <div class="sub-side">
          <img src="./images/mail-2544.svg" alt="mail icon" />
          <p>ayodejiteilolaa@gmail.com</p>
        </div>
      </div>

      <div class="mr"></div>

      <div class="side3">
        <p>Follow Us</p>

        <div class="img">
          <img src="./images/facebook-5217.svg" alt="facebook" />
          <img src="./images/black-instagram-logo-3496.svg" alt="instagram" />
          <img
            src="./images/twitter-circle-blue-logo-16617.svg"
            alt="twitter"
          />
        </div>
      </div>
    </footer>
  </body>
</html>
