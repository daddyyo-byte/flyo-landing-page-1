<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Contact Detail</legend>

        <div>
          <label for="fullName">Full-Name:</label>
          <input
            type="text"
            name="fullname"
            id="fullName"
            placeholder="Enter your fullname"
          />
        </div>
        <br>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
        </div>
      </fieldset>
      <br>
      <fieldset>
        <legend>Communication Preference</legend>

        <div>
            <input type="radio" id="email" name="comm"  value="email">
            <label for="email">Email</label>
        </div>
        <br>
        <div>
            <input type="radio" id="phoneCall" name="comm"  value="phoneCall">
            <label for="email">phoneCall</label>
        </div>
        <br>
        <div>
            <input type="radio" id="textMsg" name="comm"  value="textmsg">
            <label for="textMsg">Text Message</label>
        </div>
      </fieldset>
      <br>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
